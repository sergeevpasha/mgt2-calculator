services:
  app:
    container_name: mgt2calculator
    build:
      context: .
      args:
        UID: '${UID:-1000}'
        GID: '${GID:-1000}'
    ports:
      - '${DOCKER_NODEJS_PORT:-3000}:3000'
    volumes:
      - ./src:/var/www
    working_dir: /var/www
    user: 'node'
    env_file:
      - .env
      # `vercel env pull .env.local --environment=development` writes the Claude sign-in IDs and a 12-hour token here.
      - path: .env.local
        required: false
    environment:
      HOST: 0.0.0.0
    networks:
      - default
networks:
  default:
    name: mgt2calculator-network
    driver: bridge
